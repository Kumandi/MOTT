<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOTT — Malayalam OTT Catalog</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 48px 24px 32px;
    text-align: center;
  }
  header h1 {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  header p {
    color: #94a3b8;
    font-size: 15px;
    margin: 0 0 24px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .buttons a {
    text-decoration: none;
    background: #f1f5f9;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
  }
  .buttons a.secondary {
    background: transparent;
    color: #f1f5f9;
    border: 1px solid #334155;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 24px 64px;
  }
  .section-label {
    display: block;
    margin-bottom: 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #94a3b8;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    display: block;
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    overflow: hidden;
    background: #1e293b center / cover no-repeat;
    text-decoration: none;
  }
  .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #fff;
    color: #111;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
  }
  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 24px 10px 10px;
    background: linear-gradient(to top, rgba(0,0,0,.92), transparent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  .caption span {
    display: block;
    font-weight: 400;
    color: #cbd5e1;
    font-size: 11px;
    margin-top: 2px;
  }
  .empty { color: #94a3b8; }
</style>
</head>
<body>

<header>
  <h1>MOTT</h1>
  <p>Malayalam movies currently on OTT in India — newest release first</p>
  <div class="buttons">
    <a id="installLink" href="#">Install in Nuvio</a>
    <a id="copyLink" class="secondary" href="javascript:void(0)">Copy manifest URL</a>
  </div>
</header>

<main>
  <span class="section-label">Latest on OTT</span>
  <div id="grid"></div>
</main>

<script>
  const installUrl = "stremio://" + window.location.host + "/manifest.json";
  document.getElementById("installLink").href = installUrl;

  const manifestUrl = window.location.protocol + "//" + window.location.host + "/manifest.json";
  document.getElementById("copyLink").addEventListener("click", (e) => {
    e.preventDefault();
    navigator.clipboard.writeText(manifestUrl).then(() => {
      const link = document.getElementById("copyLink");
      const original = link.textContent;
      link.textContent = "Copied!";
      setTimeout(() => { link.textContent = original; }, 2000);
    });
  });

  // Pulls straight from our own /catalog endpoint — already sorted newest-first
  // by addon.js — and renders one poster card per movie automatically.
  fetch("catalog/movie/mott-latest.json")
    .then(r => r.json())
    .then(({ metas }) => {
      const grid = document.getElementById("grid");
      if (!metas || !metas.length) {
        grid.innerHTML = '<p class="empty">No OTT releases found right now.</p>';
        return;
      }
      grid.innerHTML = metas.slice(0, 24).map((m, i) => `
        <a class="card" href="stremio://${window.location.host}/detail/movie/${encodeURIComponent(m.id)}"
           style="background-image:${m.poster ? `url('${m.poster}')` : "none"}">
          ${i < 4 ? '<span class="badge">NEW</span>' : ""}
          <span class="caption">${m.name}${m.releaseInfo ? `<span>${m.releaseInfo}</span>` : ""}</span>
        </a>
      `).join("");
    })
    .catch(() => {
      document.getElementById("grid").innerHTML =
        '<p class="empty">Couldn\'t load the catalog right now.</p>';
    });
</script>

</body>
</html>
